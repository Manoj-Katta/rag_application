<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kubernetes Docs Q&A</title>
  <style>
    :root { --bg: #fafafa; --fg: #1b1b1f; --muted: #62626b; --card: #fff; --line: #e3e3e8; --accent: #326ce5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #131316; --fg: #ececf1; --muted: #9a9aa5; --card: #1c1c21; --line: #2e2e35; --accent: #6d9bff; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, sans-serif; }
    main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input { flex: 1 1 320px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
    select, button { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; }
    button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
    .answer { margin-top: 24px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; white-space: pre-wrap; }
    .note { color: var(--muted); margin-top: 24px; }
    .sources { margin-top: 20px; }
    .src { padding: 12px 0; border-top: 1px solid var(--line); }
    .src a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .src p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Kubernetes Docs Q&amp;A</h1>
  <p class="sub">Answers grounded in kubernetes.io docs, with citations.</p>
  <form id="f">
    <input id="q" placeholder="e.g. How do I keep ordinary pods off my GPU nodes?" required maxlength="500" />
    <select id="mode" aria-label="Retrieval mode">
      <option value="hybrid">Hybrid</option>
      <option value="vector">Vector</option>
      <option value="keyword">Keyword (BM25)</option>
    </select>
    <button>Ask</button>
  </form>
  <div id="out"></div>
</main>
<script>
  const out = document.getElementById('out');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    out.replaceChildren(el('p', 'note', 'Searching…'));
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q.value, mode: mode.value }),
    });
    const data = await res.json();
    out.replaceChildren();
    if (data.answer) out.append(el('div', 'answer', data.answer));
    if (data.note || data.error) out.append(el('p', 'note', data.note || data.error));
    const list = el('div', 'sources');
    (data.sources || []).forEach((s, n) => {
      const row = el('div', 'src');
      const a = el('a', null, `[${n + 1}] ${s.section}`);
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
      row.append(a, el('p', null, s.preview + '…'));
      list.append(row);
    });
    out.append(list);
  });
</script>
</body>
</html>
